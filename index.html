<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RADAR TÁCTICO // RECEPTOR RADIAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050811;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      color: #00d2ff;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
      margin-bottom: 12px;
      text-align: center;
    }
    /* RADAR OSCILANTE */
    .radar-container {
      position: relative;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 2px solid rgba(0, 210, 255, 0.4);
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.1) 0%, rgba(5, 8, 17, 0.95) 75%);
      overflow: hidden;
    }
    .radar-sweep {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0, 210, 255, 0.5) 0deg, transparent 60deg, transparent 360deg);
      animation: radarSpin 2.5s linear infinite;
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .radar-icon {
      font-size: 2.2rem;
      position: relative;
      z-index: 2;
    }
    /* ECUALIZADOR ANIMADO */
    .audio-equalizer {
      display: flex;
      gap: 5px;
      align-items: flex-end;
      height: 32px;
      margin-bottom: 14px;
    }
    .eq-bar {
      width: 6px;
      background: #00d2ff;
      border-radius: 3px;
      animation: eqBounce 0.8s infinite alternate ease-in-out;
    }
    .eq-bar:nth-child(1) { height: 8px; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 22px; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { height: 32px; animation-delay: 0.15s; background: #ef4444; }
    .eq-bar:nth-child(4) { height: 16px; animation-delay: 0.4s; }
    .eq-bar:nth-child(5) { height: 26px; animation-delay: 0.25s; }
    @keyframes eqBounce {
      0% { height: 4px; }
      100% { height: 32px; }
    }
    .btn-toggle {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 900;
      padding: 12px 24px;
      border-radius: 6px;
      border: 1px solid #00d2ff;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      cursor: pointer;
      margin-bottom: 16px;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
      width: 100%;
      max-width: 320px;
    }
    .btn-toggle.active {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      border-color: #f87171;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
    }
    .console-box {
      width: 100%;
      max-width: 440px;
      background: #091222;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 12px;
      font-size: 0.82rem;
      min-height: 140px;
      max-height: 180px;
      overflow-y: auto;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }
    .log-entry { margin-bottom: 5px; color: #94a3b8; }
    .log-hit-x { color: #34d399; font-weight: bold; }
    .log-hit-r { color: #fbbf24; font-weight: bold; }
    .status-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .status-badge.online {
      color: #34d399;
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
    }
  </style>
</head>
<body>

  <div class="header-title">RADAR RECEPTOR RADIAL</div>
  <div class="status-badge" id="hudStatus">MICRÓFONO EN ESPERA</div>

  <div class="radar-container">
    <div class="radar-sweep" id="radarSweep" style="display:none;"></div>
    <div class="radar-icon">🎙️</div>
  </div>

  <div class="audio-equalizer" id="equalizer" style="display:none;">
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
  </div>

  <button class="btn-toggle" id="btnRadar" onclick="toggleRadar()">ACTIVAR ESCUCHA RADIAL</button>

  <div class="console-box" id="consoleLogs">
    <div class="log-entry">> Sistema inicializado. Listo para modular...</div>
  </div>

  <script>
    let recognition = null;
    let activo = false;
    let ultimosHits = {};
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function beep() {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(1400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1900, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
      } catch(e) {}
    }

    function log(texto, clase = '') {
      const box = document.getElementById('consoleLogs');
      const div = document.createElement('div');
      div.className = 'log-entry ' + clase;
      div.textContent = `> ${texto}`;
      box.prepend(div);
    }

    function toggleRadar() {
      if (activo) {
        detenerRadar();
      } else {
        iniciarRadar();
      }
    }

    function iniciarRadar() {
      getAudioCtx();
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Tu navegador no soporta reconocimiento de voz. Usa Google Chrome o Edge.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'es-PE';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = function() {
        activo = true;
        document.getElementById('btnRadar').textContent = '🛑 DETENER ESCUCHA';
        document.getElementById('btnRadar').classList.add('active');
        document.getElementById('hudStatus').textContent = 'EN VIVO // ESCUCHANDO RADIO';
        document.getElementById('hudStatus').className = 'status-badge online';
        document.getElementById('radarSweep').style.display = 'block';
        document.getElementById('equalizer').style.display = 'flex';
        log("Frecuencia sintonizada. Acerque la radio.");
      };

      recognition.onresult = function(event) {
        let texto = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          texto += event.results[i][0].transcript;
        }
        texto = texto.trim();
        if (texto) {
          procesarVozRadio(texto.toLowerCase());
        }
      };

      recognition.onerror = function(e) {
        console.warn("Aviso:", e.error);
      };

      recognition.onend = function() {
        if (activo) {
          try { recognition.start(); } catch(e) {}
        }
      };

      try {
        recognition.start();
      } catch(err) {
        console.error(err);
      }
    }

    function detenerRadar() {
      activo = false;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('btnRadar').textContent = 'ACTIVAR ESCUCHA RADIAL';
      document.getElementById('btnRadar').classList.remove('active');
      document.getElementById('hudStatus').textContent = 'RADAR DETENIDO';
      document.getElementById('hudStatus').className = 'status-badge';
      document.getElementById('radarSweep').style.display = 'none';
      document.getElementById('equalizer').style.display = 'none';
      log("Escucha de radio finalizada.");
    }

    function procesarVozRadio(frase) {
      // Detección de Clave 20-28 (Refrigerio)
      const esRefrigerio = frase.includes("20-28") || 
                           frase.includes("20 28") || 
                           frase.includes("veinte veintiocho") || 
                           frase.includes("veinte 28") || 
                           frase.includes("refrigerio");

      // Normalización fonética
      let limp = frase
        .replace(/\bcero uno\b/g, "1").replace(/\buno\b/g, "1").replace(/\b01\b/g, "1")
        .replace(/\bcero dos\b/g, "2").replace(/\bdos\b/g, "2").replace(/\b02\b/g, "2")
        .replace(/\bcero tres\b/g, "3").replace(/\btres\b/g, "3").replace(/\b03\b/g, "3")
        .replace(/\bcero cuatro\b/g, "4").replace(/\bcuatro\b/g, "4").replace(/\b04\b/g, "4")
        .replace(/\bcero cinco\b/g, "5").replace(/\bcinco\b/g, "5").replace(/\b05\b/g, "5")
        .replace(/\balfa\b|\balpha\b/g, "A")
        .replace(/\bbravo\b/g, "B")
        .replace(/\bcharly\b|\bcharlie\b|\bcharli\b/g, "C")
        .replace(/\bdelta\b/g, "D")
        .replace(/\bsulu\b|\bzulo\b|\bsulú\b/g, "zulu")
        .replace(/\byankee\b|\byanki\b|\bianqui\b/g, "yanky");

      // Catálogo de indicativos tácticos
      const indicativos = [
        "ZULU-1", "ZULU 1", "ZULU 01",
        "ORION-A", "ORION A", "ORION ALFA",
        "ORION-B", "ORION B", "ORION BRAVO",
        "ORION-C", "ORION C", "ORION CHARLY",
        "YANKY 2", "YANKY-2", "YANKEE 2", "YANKEE 02",
        "YANKY 2 ALFA", "YANKY 3",
        "ACCESOS", "ACCESOS 02", "SUR", "CENTRO", "NORTE",
        "COORDINADOR PROSEGUR"
      ];

      const ahora = Date.now();

      indicativos.forEach(ind => {
        let indSearch = ind.toLowerCase().replace(/[^a-z0-9]/g, "");
        let limpSearch = limp.replace(/[^a-z0-9]/g, "");

        if (limpSearch.includes(indSearch)) {
          if (ultimosHits[indSearch] && (ahora - ultimosHits[indSearch] < 3500)) return;
          ultimosHits[indSearch] = ahora;

          beep();
          const valor = esRefrigerio ? 'R' : 'X';
          log(`CAPTADO: ${ind} ➔ [${valor}]`, esRefrigerio ? 'log-hit-r' : 'log-hit-x');

          // ENVIAR SEÑAL A TU APLICACIÓN WEB DE GOOGLE
          if (window.opener) {
            window.opener.postMessage({
              tipo: 'HIT_RADIO',
              indicativo: ind,
              esRefrigerio: esRefrigerio,
              texto: frase
            }, '*');
          }
        }
      });
    }
  </script>
</body>
</html>
