<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RADAR TÁCTICO // RECEPTOR RADIAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050811;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }
    .header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: #00d2ff;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
      margin-bottom: 8px;
      text-align: center;
    }
    .status-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      color: #94a3b8;
    }
    .status-badge.online {
      color: #34d399;
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.15);
    }
    /* RADAR */
    .radar-container {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px solid rgba(0, 210, 255, 0.4);
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.1) 0%, rgba(5, 8, 17, 0.95) 75%);
      overflow: hidden;
    }
    .radar-sweep {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0, 210, 255, 0.5) 0deg, transparent 60deg, transparent 360deg);
      animation: radarSpin 2.5s linear infinite;
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .radar-icon { font-size: 2rem; position: relative; z-index: 2; }

    /* ECUALIZADOR */
    .audio-equalizer {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 26px;
      margin-bottom: 12px;
    }
    .eq-bar {
      width: 5px;
      background: #00d2ff;
      border-radius: 2px;
      animation: eqBounce 0.8s infinite alternate ease-in-out;
    }
    .eq-bar:nth-child(1) { height: 8px; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 20px; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { height: 26px; animation-delay: 0.15s; background: #ef4444; }
    .eq-bar:nth-child(4) { height: 14px; animation-delay: 0.4s; }
    .eq-bar:nth-child(5) { height: 22px; animation-delay: 0.25s; }
    @keyframes eqBounce { 0% { height: 4px; } 100% { height: 26px; } }

    .btn-toggle {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 900;
      padding: 12px 20px;
      border-radius: 6px;
      border: 1px solid #00d2ff;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      cursor: pointer;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      width: 100%;
      max-width: 340px;
    }
    .btn-toggle.active {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      border-color: #f87171;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
    }

    /* MONITOR DE MODULACIÓN EN VIVO */
    .live-speech-box {
      width: 100%;
      max-width: 440px;
      background: #0d1a30;
      border: 1px solid #0284c7;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      color: #38bdf8;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .console-box {
      width: 100%;
      max-width: 440px;
      background: #091222;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.8rem;
      min-height: 140px;
      max-height: 170px;
      overflow-y: auto;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }
    .log-entry { margin-bottom: 4px; color: #94a3b8; }
    .log-hit-x { color: #34d399; font-weight: bold; }
    .log-hit-r { color: #fbbf24; font-weight: bold; }
    .catalogo-badge {
      font-size: 0.75rem;
      color: #00d2ff;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div class="header-title">RADAR RECEPTOR RADIAL</div>
  <div class="status-badge" id="hudStatus">MICRÓFONO EN ESPERA</div>
  <div class="catalogo-badge" id="hudCatCount">PUESTOS SINCRONIZADOS: CONECTANDO...</div>

  <div class="radar-container">
    <div class="radar-sweep" id="radarSweep" style="display:none;"></div>
    <div class="radar-icon">🎙️</div>
  </div>

  <div class="audio-equalizer" id="equalizer" style="display:none;">
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
  </div>

  <button class="btn-toggle" id="btnRadar" onclick="toggleRadar()">ACTIVAR ESCUCHA RADIAL</button>

  <!-- CAJA EN VIVO: MUESTRA LO QUE EL MICRÓFONO ESCUCHA EXACTAMENTE -->
  <div class="live-speech-box">
    <span style="font-size: 0.72rem; color: #94a3b8; font-weight: 700;">ÚLTIMA MODULACIÓN DETECTADA:</span>
    <span id="txtVozDetectada" style="color: #fef08a; font-weight: bold;">(En silencio)</span>
  </div>

  <div class="console-box" id="consoleLogs">
    <div class="log-entry">> Radar listo. Esperando conexión de puestos...</div>
  </div>

  <script>
    let recognition = null;
    let activo = false;
    let ultimosHits = {};
    let audioCtx = null;
    let puestosCatalogo = [];

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function beep() {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(1400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1900, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.12);
      } catch(e) {}
    }

    function log(texto, clase = '') {
      const box = document.getElementById('consoleLogs');
      const div = document.createElement('div');
      div.className = 'log-entry ' + clase;
      div.textContent = `> ${texto}`;
      box.prepend(div);
    }

    // SINCRONIZAR PUESTOS CON LA PANTALLA PRINCIPAL
    window.addEventListener('message', function(event) {
      if (event.data && event.data.tipo === 'CARGAR_PUESTOS') {
        puestosCatalogo = event.data.puestos || [];
        document.getElementById('hudCatCount').textContent = `🟢 PUESTOS SINCRONIZADOS: ${puestosCatalogo.length} PUESTOS`;
        log(`Sincronizados ${puestosCatalogo.length} puestos desde el Centro de Control.`);
      }
    });

    function solicitarPuestos() {
      if (window.opener) {
        window.opener.postMessage({ tipo: 'PEDIR_PUESTOS' }, '*');
      }
    }
    solicitarPuestos();
    setInterval(solicitarPuestos, 5000); // Reintentar periódicamente si aún no conecta

    function toggleRadar() {
      if (activo) {
        detenerRadar();
      } else {
        iniciarRadar();
      }
    }

    function iniciarRadar() {
      getAudioCtx();
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Tu navegador no soporta reconocimiento de voz. Usa Google Chrome.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'es-PE';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = function() {
        activo = true;
        document.getElementById('btnRadar').textContent = '🛑 DETENER ESCUCHA';
        document.getElementById('btnRadar').classList.add('active');
        document.getElementById('hudStatus').textContent = 'EN VIVO // ESCUCHANDO RADIO';
        document.getElementById('hudStatus').className = 'status-badge online';
        document.getElementById('radarSweep').style.display = 'block';
        document.getElementById('equalizer').style.display = 'flex';
        log("Frecuencia radial abierta. Acerque la radio.");
      };

      recognition.onresult = function(event) {
        let texto = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          texto += event.results[i][0].transcript;
        }
        texto = texto.trim();
        if (texto) {
          document.getElementById('txtVozDetectada').textContent = `"${texto.toUpperCase()}"`;
          procesarVozRadio(texto.toLowerCase());
        }
      };

      recognition.onerror = function(e) {
        console.warn("Aviso de reconocimiento:", e.error);
      };

      recognition.onend = function() {
        if (activo) {
          try { recognition.start(); } catch(e) {}
        }
      };

      try {
        recognition.start();
      } catch(err) {
        console.error(err);
      }
    }

    function detenerRadar() {
      activo = false;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('btnRadar').textContent = 'ACTIVAR ESCUCHA RADIAL';
      document.getElementById('btnRadar').classList.remove('active');
      document.getElementById('hudStatus').textContent = 'RADAR DETENIDO';
      document.getElementById('hudStatus').className = 'status-badge';
      document.getElementById('radarSweep').style.display = 'none';
      document.getElementById('equalizer').style.display = 'none';
      log("Escucha de radio pausada.");
    }

    // MOTOR DE TRADUCCIÓN MILITAR COMPLETO
    function procesarVozRadio(frase) {
      // 1. Detectar Clave 20-28 (Refrigerio)
      const esRefrigerio = frase.includes("20-28") || 
                           frase.includes("20 28") || 
                           frase.includes("veinte veintiocho") || 
                           frase.includes("veinte 28") || 
                           frase.includes("refrigerio") || 
                           frase.includes("almuerzo") || 
                           frase.includes("cena");

      // 2. Normalización de fonética militar y números
      let limp = (" " + frase + " ")
        // Números
        .replace(/\bcero uno\b|\bprimer\b|\bprimero\b/g, " 1 ")
        .replace(/\bcero dos\b|\bsegundo\b/g, " 2 ")
        .replace(/\bcero tres\b|\btercer\b|\btercero\b/g, " 3 ")
        .replace(/\bcero cuatro\b/g, " 4 ")
        .replace(/\bcero cinco\b/g, " 5 ")
        .replace(/\bcero seis\b/g, " 6 ")
        .replace(/\bcero siete\b/g, " 7 ")
        .replace(/\bcero ocho\b/g, " 8 ")
        .replace(/\bcero nueve\b/g, " 9 ")
        .replace(/\buno\b/g, " 1 ").replace(/\bdos\b/g, " 2 ").replace(/\btres\b/g, " 3 ")
        .replace(/\bcuatro\b/g, " 4 ").replace(/\bcinco\b/g, " 5 ").replace(/\bseis\b/g, " 6 ")
        .replace(/\bsiete\b/g, " 7 ").replace(/\bocho\b/g, " 8 ").replace(/\bnueve\b/g, " 9 ")
        .replace(/\bdiez\b/g, " 10 ").replace(/\bonce\b/g, " 11 ").replace(/\bdoce\b/g, " 12 ")
        // Alfabeto OTAN
        .replace(/\balfa\b|\balpha\b/g, " a ")
        .replace(/\bbravo\b/g, " b ")
        .replace(/\bcharly\b|\bcharlie\b|\bcharli\b/g, " c ")
        .replace(/\bdelta\b/g, " d ")
        .replace(/\becho\b|\beco\b/g, " e ")
        .replace(/\bfoxtrot\b|\bfox\b/g, " f ")
        .replace(/\bgolf\b/g, " g ")
        .replace(/\bhotel\b/g, " h ")
        .replace(/\bindia\b/g, " i ")
        .replace(/\bkilo\b/g, " k ")
        .replace(/\blima\b/g, " l ")
        .replace(/\bmike\b|\bmaik\b/g, " m ")
        .replace(/\bnovember\b|\bnoviembre\b/g, " n ")
        .replace(/\boscar\b/g, " o ")
        .replace(/\bpapa\b/g, " p ")
        .replace(/\bquebec\b/g, " q ")
        .replace(/\bromeo\b/g, " r ")
        .replace(/\bsierra\b/g, " s ")
        .replace(/\btango\b/g, " tango ")
        .replace(/\bvictor\b/g, " v ")
        .replace(/\bwhiskey\b|\bwhisky\b/g, " w ")
        .replace(/\bxray\b|\bx-ray\b/g, " x ")
        .replace(/\byankee\b|\byanki\b|\byanky\b|\bianqui\b/g, " yanki ")
        .replace(/\bsulu\b|\bzulo\b|\bsulú\b/g, " zulu ")
        .replace(/\s+/g, " ")
        .trim();

      const ahora = Date.now();
      const limpCompacta = limp.replace(/[^a-z0-9]/g, "");

      // 3. Evaluar contra los puestos reales sincronizados
      puestosCatalogo.forEach(p => {
        let indSimple = (p.indicativo || '').toLowerCase().replace(/[^a-z0-9]/g, "")
          .replace(/yankee|yanky/g, "yanki")
          .replace(/sulu|zulo/g, "zulu");

        let puestoSimple = (p.puesto || '').toLowerCase().replace(/[^a-z0-9]/g, "")
          .replace(/yankee|yanky/g, "yanki")
          .replace(/sulu|zulo/g, "zulu");

        let match = false;

        // Búsqueda inteligente por indicativo exacto o contenido en modulación
        if (indSimple && (limpCompacta.includes(indSimple) || indSimple.includes(limpCompacta))) {
          if (indSimple.length >= 2) match = true;
        } else if (puestoSimple.includes("coordinadorprosegur") && limpCompacta.includes("coordinador")) {
          match = true;
        } else if (indSimple && limp.includes((p.indicativo || '').toLowerCase())) {
          match = true;
        }

        if (match) {
          if (ultimosHits[p.idx] && (ahora - ultimosHits[p.idx] < 3500)) return;
          ultimosHits[p.idx] = ahora;

          beep();
          const valor = esRefrigerio ? 'R' : 'X';
          log(`🎯 CAPTADO: ${p.puesto} ➔ [${valor}]`, esRefrigerio ? 'log-hit-r' : 'log-hit-x');

          // Enviar orden a Google Apps Script
          if (window.opener) {
            window.opener.postMessage({
              tipo: 'HIT_RADIO_EXACTO',
              idx: p.idx,
              valor: valor
            }, '*');
          }
        }
      });
    }
  </script>
</body>
</html>
