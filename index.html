<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RADAR TÁCTICO // OÍDO FINO v5.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #050811;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      overflow-x: hidden;
    }
    .header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      color: #00d2ff;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
      margin-bottom: 6px;
      text-align: center;
    }
    .status-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 8px;
      border: 1px solid #10b981;
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
    }
    .radar-container {
      position: relative;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      border: 2px solid rgba(0, 210, 255, 0.4);
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.1) 0%, rgba(5, 8, 17, 0.95) 75%);
      overflow: hidden;
    }
    .radar-sweep {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, rgba(0, 210, 255, 0.5) 0deg, transparent 60deg, transparent 360deg);
      animation: radarSpin 2.5s linear infinite;
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .radar-icon { font-size: 1.8rem; position: relative; z-index: 2; }
    .audio-equalizer {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 22px;
      margin-bottom: 8px;
    }
    .eq-bar {
      width: 5px;
      background: #00d2ff;
      border-radius: 2px;
      animation: eqBounce 0.8s infinite alternate ease-in-out;
    }
    .eq-bar:nth-child(1) { height: 8px; animation-delay: 0.1s; }
    .eq-bar:nth-child(2) { height: 18px; animation-delay: 0.3s; }
    .eq-bar:nth-child(3) { height: 22px; animation-delay: 0.15s; background: #ef4444; }
    .eq-bar:nth-child(4) { height: 14px; animation-delay: 0.4s; }
    .eq-bar:nth-child(5) { height: 20px; animation-delay: 0.25s; }
    @keyframes eqBounce { 0% { height: 4px; } 100% { height: 22px; } }

    .btn-toggle {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.88rem;
      font-weight: 900;
      padding: 10px 18px;
      border-radius: 6px;
      border: 1px solid #00d2ff;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #fff;
      cursor: pointer;
      margin-bottom: 8px;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      width: 100%;
      max-width: 340px;
    }
    .btn-toggle.active {
      background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
      border-color: #f87171;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
    }
    .live-speech-box {
      width: 100%;
      max-width: 440px;
      background: #0d1a30;
      border: 1px solid #eab308;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: #fef08a;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .console-box {
      width: 100%;
      max-width: 440px;
      background: #091222;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.78rem;
      min-height: 130px;
      max-height: 160px;
      overflow-y: auto;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }
    .log-entry { margin-bottom: 4px; color: #94a3b8; }
    .log-hit-x { color: #34d399; font-weight: bold; font-size: 0.82rem; }
    .log-hit-r { color: #fbbf24; font-weight: bold; font-size: 0.82rem; }
  </style>
</head>
<body>

  <div class="header-title">RADAR RECEPTOR RADIAL v5.0</div>
  <div class="status-badge" id="hudStatus">SISTEMA EN VIVO // OÍDO FINO ACTIVO</div>

  <div class="radar-container">
    <div class="radar-sweep" id="radarSweep" style="display:none;"></div>
    <div class="radar-icon">🎙️</div>
  </div>

  <div class="audio-equalizer" id="equalizer" style="display:none;">
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
    <div class="eq-bar"></div>
  </div>

  <button class="btn-toggle" id="btnRadar" onclick="toggleRadar()">ACTIVAR ESCUCHA RADIAL</button>

  <div class="live-speech-box">
    <span style="font-size: 0.7rem; color: #94a3b8; font-weight: 700;">🎤 MODULACIÓN EN VIVO:</span>
    <span id="txtVozDetectada" style="color: #fef08a; font-weight: bold;">(En silencio)</span>
  </div>

  <div class="console-box" id="consoleLogs">
    <div class="log-entry">> Radar v5.0 listo con transmisor dual activo.</div>
  </div>

  <script>
    let recognition = null;
    let activo = false;
    let ultimosHits = {};
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function beep() {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(1400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1900, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.12);
      } catch(e) {}
    }

    function log(texto, clase = '') {
      const box = document.getElementById('consoleLogs');
      const div = document.createElement('div');
      div.className = 'log-entry ' + clase;
      div.textContent = `> ${texto}`;
      box.prepend(div);
    }

    function toggleRadar() {
      if (activo) {
        detenerRadar();
      } else {
        iniciarRadar();
      }
    }

    function iniciarRadar() {
      getAudioCtx();
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Tu navegador no soporta reconocimiento de voz. Usa Google Chrome.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'es-PE';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = function() {
        activo = true;
        document.getElementById('btnRadar').textContent = '🛑 DETENER ESCUCHA';
        document.getElementById('btnRadar').classList.add('active');
        document.getElementById('radarSweep').style.display = 'block';
        document.getElementById('equalizer').style.display = 'flex';
        log("Frecuencia radial abierta. Modulando...");
      };

      recognition.onresult = function(event) {
        let textoFinal = '';
        let textoInterim = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            textoFinal += event.results[i][0].transcript;
          } else {
            textoInterim += event.results[i][0].transcript;
          }
        }

        const texto = (textoFinal || textoInterim).trim();
        if (texto) {
          document.getElementById('txtVozDetectada').textContent = `"${texto.toUpperCase()}"`;
          procesarVozRadio(texto.toLowerCase());
        }
      };

      recognition.onerror = function(e) {
        console.warn("Aviso:", e.error);
      };

      recognition.onend = function() {
        if (activo) {
          try { recognition.start(); } catch(e) {}
        }
      };

      try {
        recognition.start();
      } catch(err) {
        console.error(err);
      }
    }

    function detenerRadar() {
      activo = false;
      if (recognition) {
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('btnRadar').textContent = 'ACTIVAR ESCUCHA RADIAL';
      document.getElementById('btnRadar').classList.remove('active');
      document.getElementById('radarSweep').style.display = 'none';
      document.getElementById('equalizer').style.display = 'none';
      log("Escucha pausada.");
    }

    // =======================================================================
    // MOTOR DE OÍDO FINO CON CORRECCIÓN FONÉTICA RADIAL
    // =======================================================================
    function procesarVozRadio(fraseOriginal) {
      // 1. Clave 20-28 (Refrigerio)
      const esRefrigerio = /20[- ]?28|veinte\s*veintiocho|veinte\s*28|refrigerio|almuerzo|cena/.test(fraseOriginal);

      let t = (" " + fraseOriginal.toLowerCase() + " ");

      // 2. CORREGIR PALABRAS QUE EL MIC CONFUNDE POR DISTORSIÓN DE RADIO
      t = t
        // Confusiones comunes de TANGO
        .replace(/\btengo\b|\btambo\b|\bdango\b|\btando\b|\btanke\b|\btanques\b|\btaco\b/g, " tango ")
        // Confusiones comunes de YANKI
        .replace(/\bllanqui\b|\bllanki\b|\byankee\b|\bianqui\b|\byanky\b/g, " yanki ")
        // Confusiones comunes de ZULU
        .replace(/\bsulu\b|\bzulo\b|\bsulú\b|\bsolo\b/g, " zulu ");

      // 3. DESPEGAR PALABRAS Y NÚMEROS PEGADOS
      const prefijos = [
        "zulu", "tango", "orion", "yanki", "golf", "foxtrot",
        "alfa", "bravo", "charly", "delta", "accesos", "balanza", "muelle"
      ];

      prefijos.forEach(p => {
        const reg = new RegExp("(" + p + ")(uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieciseis|diecisiete|dieciocho|diecinueve|veinte|[0-9]+|[a-z])", "gi");
        t = t.replace(reg, "$1 $2");
      });

      // Despegar números y letras (ej: 3a -> 3 a, 1a -> 1 a)
      t = t.replace(/(\d+)([a-z]+)/gi, "$1 $2").replace(/([a-z]+)(\d+)/gi, "$1 $2");

      // 4. MAPEO DE NÚMEROS
      const mapaNumeros = {
        "cero uno": "1", "primero": "1", "primer": "1", "uno": "1",
        "cero dos": "2", "segundo": "2", "dos": "2",
        "cero tres": "3", "tercero": "3", "tercer": "3", "tres": "3",
        "cero cuatro": "4", "cuarto": "4", "cuatro": "4",
        "cero cinco": "5", "quinto": "5", "cinco": "5",
        "cero seis": "6", "sexto": "6", "seis": "6",
        "cero siete": "7", "septimo": "7", "séptimo": "7", "siete": "7",
        "cero ocho": "8", "octavo": "8", "ocho": "8",
        "cero nueve": "9", "noveno": "9", "nueve": "9",
        "diez": "10", "once": "11", "doce": "12", "trece": "13", "catorce": "14",
        "quince": "15", "dieciseis": "16", "dieciséis": "16", "diecisiete": "17",
        "dieciocho": "18", "diecinueve": "19", "veinte": "20"
      };

      for (const [pal, num] of Object.entries(mapaNumeros)) {
        t = t.replace(new RegExp("\\b" + pal + "\\b", "gi"), " " + num + " ");
      }

      // 5. MAPEO OTAN
      const mapaOtan = {
        "alfa": "A", "alpha": "A", "bravo": "B",
        "charly": "C", "charlie": "C", "charli": "C", "delta": "D",
        "foxtrot": "FOXTROT", "fox": "FOXTROT", "golf": "GOLF"
      };

      for (const [otan, letra] of Object.entries(mapaOtan)) {
        t = t.replace(new RegExp("\\b" + otan + "\\b", "gi"), " " + letra + " ");
      }

      const compacta = t.toUpperCase().replace(/[^A-Z0-9]/g, "");

      // 6. CATÁLOGO DE PATRONES DE PUESTOS
      const patrones = [
        "ZULU 1", "ZULU 2",
        "TANGO 1", "TANGO 2", "TANGO 3", "TANGO 4", "TANGO 5",
        "TANGO 6", "TANGO 7", "TANGO 8", "TANGO 9", "TANGO 10",
        "TANGO 11", "TANGO 12", "TANGO 13", "TANGO 14", "TANGO 15",
        "TANGO 16", "TANGO 17", "TANGO 18", "TANGO 19", "TANGO 20",
        "GOLF 1A", "GOLF R", "GOLF", "FOXTROT",
        "YANKI 1", "YANKI 2", "YANKI 2A", "YANKI 2 ALFA", "YANKI 3", "YANKI 3A", "YANKI 4",
        "ORION A", "ORION B", "ORION C", "ORION D",
        "ACCESOS 02", "ACCESOS DOCUMENTACION 1", "ACCESOS DOCUMENTACION 2",
        "ACCESOS INGRESOS", "ACCESOS", "COORDINADOR PROSEGUR",
        "SUR", "CENTRO", "NORTE"
      ];

      const ahora = Date.now();

      patrones.forEach(patron => {
        const pComp = patron.replace(/[^A-Z0-9]/g, "");

        if (compacta.includes(pComp)) {
          if (ultimosHits[pComp] && (ahora - ultimosHits[pComp] < 3500)) return;
          ultimosHits[pComp] = ahora;

          beep();
          const valor = esRefrigerio ? 'R' : 'X';
          log(`🎯 RECONOCIDO: ${patron} ➔ [${valor}]`, esRefrigerio ? 'log-hit-r' : 'log-hit-x');

          // TRANSMISIÓN MULTI-CANAL PARA ATRAVESAR EL IFRAME DE GOOGLE
          const payload = {
            tipo: 'HIT_RADIO_PATRON',
            patron: patron,
            esRefrigerio: esRefrigerio,
            ts: ahora
          };

          // Canal 1: postMessage directo
          if (window.opener) {
            window.opener.postMessage(payload, '*');
          }
          // Canal 2: postMessage a marcos internos
          if (window.opener && window.opener.frames) {
            for (let i = 0; i < window.opener.frames.length; i++) {
              try { window.opener.frames[i].postMessage(payload, '*'); } catch(e) {}
            }
          }
        }
      });
    }
  </script>
</body>
</html>
